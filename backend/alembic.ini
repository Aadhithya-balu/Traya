# Alembic configuration for TRAYA.
# The actual database URL is injected by migrations/env.py from app settings
# (app.config.settings), so `sqlalchemy.url` here is only a placeholder.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is overridden at runtime by env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
